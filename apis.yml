aid: microagi
name: Microagi
description: 'Microagi (stylized microagi) is a data research lab building end-to-end
  physical, embodied AGI, with a stated focus on reliable real-world deployments; its
  public positioning is "Accelerating embodied AGI." Backed by Northzone, the company
  is early-stage: as of this profile its public presence is a single marketing site
  at microagi.ai with no published developer API, documentation, SDKs, CLI, or agent
  surface. This API Evangelist profile tracks Microagi as a portfolio lead; artifacts
  here are limited to a live domain-security probe of the marketing host until a developer
  surface is published. (Note: the unrelated github.com/microagi org, "µAGI / microagi.dev"
  by Vitakka Consulting, is a separate entity and is deliberately not attributed here.)'
